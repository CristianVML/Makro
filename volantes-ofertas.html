    margin-right: auto;
    opacity: 1;

    font-size: 1.25em;

    margin-bottom: var(--spacing-xs);
    text-align: center;
    font-weight: 700;

  .thumbnail-validity-label {

  }

  .thumbnail-button {
    color: var(--color-white);
    background-color: var(--color-primary);
    border-color: var(--color-primary);
    width: 100%;
    font-size: 1.125em;
  }

  .thumbnail:hover .thumbnail-button,
  .thumbnail:active .thumbnail-button {
    text-decoration: underline;
  }

  .is-hidden {

    margin-left: auto;
    margin-right: auto;
  }

  .position-bottom-right {

    bottom: 0;
    right: 0;

  .position-bottom-left {

    margin-right: auto;

  .thumbnail:hover .thumbnail-image-container img,

  }

  .thumbnail-title {
    font-size: 1.25em;
    margin-top: 10px;
    margin-bottom: 10px;
    text-align: center;
    font-weight: 700;
    color: var(--color-gray-text);

    height: auto;
    min-height: 90px;

    line-height: 1.35;
    padding: 0 8px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

  .thumbnail-validity {
    font-size: 1em;
    text-align: center;
  }

  .thumbnail-validity-label {

  }

  .thumbnail-button {

    border-color: var(--color-primary);

    font-size: 1.125em;

  .is-hidden {
    display: none;
  }

    border-radius: var(--border-radius);
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    border: 2px solid var(--color-primary);

    display: block;
    max-width: 100%;
  }

  .app-makro-image-bottom {
    display: none;
    max-width: 100%;
  }

  .section-makromail {

  }

  @media only screen and (min-device-width: 1441px) and (max-device-width: 2560px) {

    }

  /* ===== Mobile Responsive ===== */
  @media (max-width: 767px) {
    .mobile-padding {

      margin-top: var(--spacing-md);

    .btn-white {
      font-size: 10px;
      margin: var(--spacing-md) auto 0;
    }

    .btn-yellow {
      font-size: var(--font-size-sm);
      margin: 0.25em auto 0;
    }

    .landing-section .btn-subscribe {
      cursor: pointer;
    }

    .social-section .store-links div {
      margin: 1em 0;

    .landing-section .section-heading {
      font-size: 1.8em;
      margin-bottom: 1em;

    }

    .social-icons .section-subtitle {
      font-size: 1.25em;
      margin-bottom: var(--spacing-sm);
      margin-top: var(--spacing-sm);
    }

    .image-gallery .gallery-thumb {
      margin-bottom: 1em;
    }

    .section-makromail .issuu-embed {

      height: 100vw;

      left: 50%;
      transform: translate(-50%, 0);

    .social-media-bar .social-list-item.text {
      margin-top: 0.5em;

</style>
